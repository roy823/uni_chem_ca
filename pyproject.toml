[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uni-chem-ca"
version = "0.5.0"
description = "Bounded local quantum-cell execution with independent field inputs and HF references"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["torch>=2.5,<3", "numpy>=1.26,<3", "scipy>=1.11,<2", "ase>=3.22"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.8"]
data = ["requests>=2.31"]
physics = ["pyscf>=2.10,<3"]

[project.scripts]
unichem = "unichem.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
unichem = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
