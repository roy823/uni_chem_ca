name: tests
on: [push, pull_request]
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev,physics]"
      - run: python -m pytest -q
      - run: unichem evaluate --xyz examples/water.xyz --output outputs/ci-evaluate
      - run: unichem simulate --xyz examples/water.xyz --steps 2 --output outputs/ci-simulate
